<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت فوتبالی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-card: #161b26;
      --bg-card-hover: #1f2637;
      --primary-green: #00ff87;
      --accent-gold: #ffd700;
      --accent-silver: #c0c0c0;
      --accent-bronze: #cd7f32;
      --accent-blue: #00b4d8;
      --accent-red: #ff4d4d;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* Login Form Styles */
    .login-wrapper {
      max-width: 400px;
      margin: 80px auto;
      background: var(--bg-card);
      padding: 35px 25px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .login-wrapper h3 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 25px;
      color: var(--accent-gold);
    }

    .custom-input {
      width: 100%;
      padding: 12px 16px;
      margin: 10px 0;
      background: rgba(11, 14, 20, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-white);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .custom-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    textarea.custom-input {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-auth {
      background-color: var(--accent-gold);
      color: #000;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      width: 100%;
      margin-top: 10px;
    }

    .btn-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
    }

    .btn-danger {
      background-color: rgba(255, 77, 77, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(255, 77, 77, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
    }

    .btn-danger:hover {
      background-color: var(--accent-red);
      color: #fff;
    }

    .btn-edit {
      background-color: rgba(255, 215, 0, 0.15);
      color: var(--accent-gold);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
    }

    .btn-edit:hover {
      background-color: var(--accent-gold);
      color: #000;
    }

    .btn-add {
      background: var(--primary-green);
      color: #000;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      font-weight: bold;
      padding: 0;
      box-shadow: 0 0 12px rgba(0, 255, 135, 0.4);
    }

    .btn-add:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(0, 255, 135, 0.6);
    }

    .btn-topic {
      background: rgba(0, 180, 216, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 180, 216, 0.4);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .btn-topic:hover {
      background: var(--accent-blue);
      color: #000;
    }

    /* Dynamic Player Input Rows */
    .dynamic-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-sub-add {
      background: rgba(0, 255, 135, 0.2);
      color: var(--primary-green);
      border: 1px solid rgba(0, 255, 135, 0.4);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-sub-add:hover {
      background: var(--primary-green);
      color: #000;
    }

    /* Dashboard Header & Grid */
    .dashboard-header {
      text-align: center;
      margin: 30px 0 40px 0;
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(45deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      max-width: 900px;
      margin: 0 auto;
    }

    .dash-btn {
      background: var(--bg-card);
      color: var(--text-white);
      padding: 25px 15px;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dash-btn:hover {
      background: var(--bg-card-hover);
      transform: translateY(-4px);
      border-color: var(--accent-gold);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      color: var(--accent-gold);
    }

    /* Modal Popup Styles */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      width: 95vw;
      height: 95vh;
      max-width: 900px;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .modal-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 77, 77, 0.2);
      color: var(--accent-red);
      border-color: var(--accent-red);
    }

    #modalFormContainer {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      max-height: 70vh;
      overflow-y: auto;
    }

    #modalListContainer {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
    }

    #modalListContainer::-webkit-scrollbar,
    #modalFormContainer::-webkit-scrollbar {
      width: 6px;
    }
    #modalListContainer::-webkit-scrollbar-track,
    #modalFormContainer::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    #modalListContainer::-webkit-scrollbar-thumb,
    #modalFormContainer::-webkit-scrollbar-thumb {
      background: var(--bg-card-hover);
      border-radius: 4px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 12px;
      transition: background-color 0.2s;
      font-size: 0.95rem;
    }

    .data-row:hover {
      background-color: var(--bg-card-hover);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .modal-content {
        width: 95vw;
        height: 95vh;
        padding: 16px;
      }
      .data-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <div id="loginSection" class="login-wrapper">
    <h3>ورود به پنل مدیریت</h3>
    <input type="text" id="x_user" class="custom-input" placeholder="نام کاربری" autocomplete="off" spellcheck="false">
    <input type="text" id="x_pass" class="custom-input" placeholder="رمز عبور" style="-webkit-text-security: disk;" autocomplete="off" spellcheck="false">
    <button onclick="handleLogin()" class="btn btn-auth">ورود به سیستم</button>
  </div>

  <div id="dashboardSection" class="hidden">
    <h2 class="dashboard-header">پنل مدیریت سایت فوتبالی</h2>
    <div class="dashboard-grid">
      <button class="dash-btn" onclick="openModal('adminInfo')">اطلاعات مدیر</button>
      <button class="dash-btn" onclick="openModal('teams')">لیست تیم‌ها</button>
      <button class="dash-btn" onclick="openModal('products')">محصولات</button>
      <button class="dash-btn" onclick="openModal('news')">اخبار</button>
      <button class="dash-btn" onclick="openModal('honors')">افتخارات</button>
      <button class="dash-btn" onclick="openModal('matches')">بازی‌ها (امار) </button>
      <button class="dash-btn" onclick="openModal('topScorers')">آقای گل</button>
      <button class="dash-btn" onclick="openModal('games')">بازی ها</button>
    </div>
  </div>

  <div id="appModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">عنوان</h3>
        <div class="modal-header-actions">
          <button id="modalTopicBtn" class="btn btn-topic hidden" onclick="renderGamesTopicForm()">موضوع بازی‌ها</button>
          <button id="modalAddBtn" class="btn btn-add hidden">+</button>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
      </div>
      <div id="modalFormContainer" class="hidden"></div>
      <div id="modalListContainer"></div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/proxy?path=';
    let currentAdmin = { user: 'fizon', pass: 'fizon' };
    let activeModule = '';

    // Auth Handling
    function handleLogin() {
      const u = document.getElementById('x_user').value;
      const p = document.getElementById('x_pass').value;
      if (u === currentAdmin.user && p === currentAdmin.pass) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
      } else {
        alert('نام کاربری یا رمز عبور اشتباه است');
      }
    }

    // Modal Control
    function openModal(module) {
      activeModule = module;
      document.getElementById('appModal').classList.remove('hidden');
      document.getElementById('modalFormContainer').classList.add('hidden');
      document.getElementById('modalFormContainer').innerHTML = '';
      
      const titleMap = {
        adminInfo: 'اطلاعات مدیر',
        teams: 'لیست تیم‌ها',
        products: 'محصولات',
        news: 'اخبار',
        honors: 'افتخارات',
        matches: 'بازی‌ها (امار)',
        topScorers: 'آقای گل',
        games: 'بازی ها'
      };
      
      document.getElementById('modalTitle').innerText = titleMap[module];
      const addBtn = document.getElementById('modalAddBtn');
      const topicBtn = document.getElementById('modalTopicBtn');
      
      if (module === 'games') {
        topicBtn.classList.remove('hidden');
      } else {
        topicBtn.classList.add('hidden');
      }

      if (module === 'adminInfo') {
        addBtn.classList.add('hidden');
        renderAdminForm();
      } else {
        addBtn.classList.remove('hidden');
        addBtn.onclick = () => renderAddEditForm();
        fetchModuleData();
      }
    }

    function closeModal() {
      document.getElementById('appModal').classList.add('hidden');
    }

    // Proxy API Requests
    async function apiRequest(path, method = 'GET', body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(`${API_BASE}${path}`, opts);
      return await res.json();
    }

    // Module Fetch & Render
    async function fetchModuleData() {
      const container = document.getElementById('modalListContainer');
      container.innerHTML = 'در حال بارگذاری...';
      const data = await apiRequest(activeModule);
      container.innerHTML = '';
      
      if (!data) { container.innerHTML = 'هیچ داده‌ای یافت نشد.'; return; }

      Object.keys(data).forEach(id => {
        const item = data[id];
        const row = document.createElement('div');
        row.className = 'data-row';
        row.innerHTML = `
          <div>${getItemText(item)}</div>
          <div class="actions">
            <button class="btn btn-edit" onclick="renderAddEditForm('${id}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">✎</button>
            <button class="btn btn-danger" onclick="deleteItem('${id}')">🗑</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function getItemText(item) {
      switch(activeModule) {
        case 'teams': return `نام: ${item.name} | گل: ${item.goals} | امتیاز: ${item.points}`;
        case 'products': return `محصول: ${item.name} | قیمت: ${item.price} | توضیح: ${item.desc}`;
        case 'news': return `<b>${item.title}</b>: ${item.desc}`;
        case 'honors': return `مربی: ${item.coach} | طلا: ${item.gold} | نقره: ${item.silver} | برنز: ${item.bronze}`;
        case 'matches': return `${item.team1} (${item.goals1}) - (${item.goals2}) ${item.team2}`;
        case 'topScorers': return `[${item.rank}] ${item.player} (${item.team}) - گل: ${item.goals} | پرچم: ${item.flag}`;
        case 'games': return `تیم اول: <b>${item.team1}</b> | تیم دوم: <b>${item.team2}</b>`;
        default: return '';
      }
    }

    // Helper functions to dynamically add/remove player input fields
    function addPlayerField(containerId, value = '') {
      const wrapper = document.getElementById(containerId);
      const div = document.createElement('div');
      div.className = 'dynamic-row';
      div.innerHTML = `
        <input class="custom-input player-input" placeholder="نام بازیکن" value="${value}">
        <button class="btn btn-danger" type="button" onclick="this.parentElement.remove()">✕</button>
      `;
      wrapper.appendChild(div);
    }

    // Dynamic Form Builder
    function renderAddEditForm(id = null, itemData = {}) {
      const container = document.getElementById('modalFormContainer');
      container.classList.remove('hidden');
      
      let fields = '';
      if (activeModule === 'teams') {
        fields = `
          <input id="f_name" class="custom-input" placeholder="نام تیم" value="${itemData.name || ''}">
          <input id="f_goals" type="number" class="custom-input" placeholder="تعداد گل" value="${itemData.goals || ''}">
          <input id="f_points" type="number" class="custom-input" placeholder="امتیاز تیم" value="${itemData.points || ''}">
        `;
      } else if (activeModule === 'products') {
        fields = `
          <input id="f_name" class="custom-input" placeholder="نام محصول" value="${itemData.name || ''}">
          <input id="f_price" class="custom-input" placeholder="قیمت محصول" value="${itemData.price || ''}">
          <input id="f_desc" class="custom-input" placeholder="توضیحات اضافی" value="${itemData.desc || ''}">
        `;
      } else if (activeModule === 'news') {
        fields = `
          <input id="f_title" class="custom-input" placeholder="عنوان اخبار" value="${itemData.title || ''}">
          <textarea id="f_desc" class="custom-input" placeholder="توضیحات اخبار">${itemData.desc || ''}</textarea>
        `;
      } else if (activeModule === 'honors') {
        fields = `
          <input id="f_coach" class="custom-input" placeholder="نام مربی" value="${itemData.coach || ''}">
          <input id="f_gold" type="number" class="custom-input" placeholder="تعداد مدال طلا" value="${itemData.gold || ''}">
          <input id="f_silver" type="number" class="custom-input" placeholder="تعداد مدال نقره" value="${itemData.silver || ''}">
          <input id="f_bronze" type="number" class="custom-input" placeholder="تعداد مدال برنز" value="${itemData.bronze || ''}">
        `;
      } else if (activeModule === 'matches') {
        fields = `
          <input id="f_team1" class="custom-input" placeholder="نام تیم اول" value="${itemData.team1 || ''}">
          <input id="f_media1" class="custom-input" placeholder="نام رسانه برای تیم یک" value="${itemData.media1 || ''}">
          <input id="f_coach1" class="custom-input" placeholder="مربی تیم اول" value="${itemData.coach1 || ''}">
          <input id="f_goals1" type="number" class="custom-input" placeholder="تعداد گل های تیم اول" value="${itemData.goals1 || ''}">
          
          <label>بازیکنان تیم اول:</label>
          <div id="players1_container"></div>
          <button type="button" class="btn-sub-add" onclick="addPlayerField('players1_container')">+ افزودن بازیکن برای تیم اول</button>

          <hr style="border-color: var(--border-color); margin: 15px 0;">

          <input id="f_team2" class="custom-input" placeholder="نام تیم حریف" value="${itemData.team2 || ''}">
          <input id="f_media2" class="custom-input" placeholder="نام رسانه برای تیم دو" value="${itemData.media2 || ''}">
          <input id="f_coach2" class="custom-input" placeholder="مربی تیم دوم" value="${itemData.coach2 || ''}">
          <input id="f_goals2" type="number" class="custom-input" placeholder="تعداد گل های تیم دوم" value="${itemData.goals2 || ''}">
          
          <label>بازیکنان تیم دوم:</label>
          <div id="players2_container"></div>
          <button type="button" class="btn-sub-add" onclick="addPlayerField('players2_container')">+ افزودن بازیکن برای تیم دوم</button>
        `;
      } else if (activeModule === 'topScorers') {
        fields = `
          <input id="f_player" class="custom-input" placeholder="نام بازیکن" value="${itemData.player || ''}">
          <input id="f_team" class="custom-input" placeholder="تیم بازیکن" value="${itemData.team || ''}">
          <input id="f_flag" class="custom-input" placeholder="پرچم بازیکن" value="${itemData.flag || ''}">
          <input id="f_rank" type="number" class="custom-input" placeholder="رتبه بازیکن" value="${itemData.rank || ''}">
          <input id="f_goals" type="number" class="custom-input" placeholder="تعداد گل ها" value="${itemData.goals || ''}">
        `;
      } else if (activeModule === 'games') {
        fields = `
          <input id="f_team1" class="custom-input" placeholder="تیم اول" value="${itemData.team1 || ''}">
          <input id="f_team2" class="custom-input" placeholder="تیم دوم" value="${itemData.team2 || ''}">
        `;
      }

      container.innerHTML = `
        ${fields}
        <button class="btn btn-auth" style="margin-top: 15px;" onclick="saveData('${id || ''}')">تایید و ثبت</button>
      `;

      // Populate existing players if editing a match
      if (activeModule === 'matches') {
        const p1List = itemData.players1 || [];
        if (p1List.length > 0) {
          p1List.forEach(p => addPlayerField('players1_container', p));
        } else {
          addPlayerField('players1_container');
        }

        const p2List = itemData.players2 || [];
        if (p2List.length > 0) {
          p2List.forEach(p => addPlayerField('players2_container', p));
        } else {
          addPlayerField('players2_container');
        }
      }
    }

    // Games Topic Form Builder
    async function renderGamesTopicForm() {
      const container = document.getElementById('modalFormContainer');
      container.classList.remove('hidden');
      
      const currentTopic = await apiRequest('gamesTopic');
      const topicText = (currentTopic && currentTopic.title) ? currentTopic.title : '';

      container.innerHTML = `
        <label>متن موضوع بازی‌ها:</label>
        <textarea id="f_games_topic" class="custom-input" placeholder="متن موضوع بازی‌ها را وارد کنید">${topicText}</textarea>
        <button class="btn btn-auth" style="margin-top: 15px;" onclick="saveGamesTopic()">تایید موضوع</button>
      `;
    }

    // Save Games Topic
    async function saveGamesTopic() {
      const topicVal = document.getElementById('f_games_topic').value;
      await apiRequest('gamesTopic', 'PUT', { title: topicVal });
      document.getElementById('modalFormContainer').classList.add('hidden');
      alert('موضوع بازی‌ها با موفقیت بروزرسانی شد.');
    }

    // Save Data (POST / PUT)
    async function saveData(id) {
      let payload = {};
      if (activeModule === 'teams') {
        payload = { name: document.getElementById('f_name').value, goals: document.getElementById('f_goals').value, points: document.getElementById('f_points').value };
      } else if (activeModule === 'products') {
        payload = { name: document.getElementById('f_name').value, price: document.getElementById('f_price').value, desc: document.getElementById('f_desc').value };
      } else if (activeModule === 'news') {
        payload = { title: document.getElementById('f_title').value, desc: document.getElementById('f_desc').value };
      } else if (activeModule === 'honors') {
        payload = { coach: document.getElementById('f_coach').value, gold: document.getElementById('f_gold').value, silver: document.getElementById('f_silver').value, bronze: document.getElementById('f_bronze').value };
      } else if (activeModule === 'matches') {
        const players1 = Array.from(document.querySelectorAll('#players1_container .player-input'))
                              .map(inp => inp.value.trim()).filter(Boolean);
        const players2 = Array.from(document.querySelectorAll('#players2_container .player-input'))
                              .map(inp => inp.value.trim()).filter(Boolean);

        payload = { 
          team1: document.getElementById('f_team1').value, 
          media1: document.getElementById('f_media1').value,
          coach1: document.getElementById('f_coach1').value,
          goals1: document.getElementById('f_goals1').value, 
          players1: players1,
          team2: document.getElementById('f_team2').value, 
          media2: document.getElementById('f_media2').value,
          coach2: document.getElementById('f_coach2').value,
          goals2: document.getElementById('f_goals2').value,
          players2: players2
        };
      } else if (activeModule === 'topScorers') {
        payload = { player: document.getElementById('f_player').value, team: document.getElementById('f_team').value, flag: document.getElementById('f_flag').value, rank: document.getElementById('f_rank').value, goals: document.getElementById('f_goals').value };
      } else if (activeModule === 'games') {
        payload = { team1: document.getElementById('f_team1').value, team2: document.getElementById('f_team2').value };
      }

      const path = id ? `${activeModule}/${id}` : activeModule;
      const method = id ? 'PUT' : 'POST';

      await apiRequest(path, method, payload);
      document.getElementById('modalFormContainer').classList.add('hidden');
      fetchModuleData();
    }

    // Delete Data
    async function deleteItem(id) {
      if (confirm('آیا از حذف این مورد اطمینان دارید؟')) {
        await apiRequest(`${activeModule}/${id}`, 'DELETE');
        fetchModuleData();
      }
    }

    // Admin Info Handling
    function renderAdminForm() {
      const container = document.getElementById('modalListContainer');
      container.innerHTML = `
        <div style="padding: 10px 0;">
          <label>نام کاربری جدید:</label>
          <input id="new_u" class="custom-input" value="${currentAdmin.user}">
          <label>رمز عبور جدید:</label>
          <input id="new_p" class="custom-input" value="${currentAdmin.pass}">
          <button class="btn btn-auth" style="margin-top: 20px;" onclick="updateAdmin()">ویرایش اطلاعات مدیر</button>
        </div>
      `;
    }

    function updateAdmin() {
      currentAdmin.user = document.getElementById('new_u').value;
      currentAdmin.pass = document.getElementById('new_p').value;
      alert('اطلاعات مدیر با موفقیت تغییر یافت.');
      closeModal();
    }
  </script>
</body>
</html>
